<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemotedCar</title>
</head>
<body>
    add things here so it will look like a login screen and make requests from the servevr the server
    <h1>please sign in</h1>
    <div id="data-form">
        <label>username:</label>
        <input type="text" id="usernameBox" />
        <label>password:</label>
        <input type="password" id="passwordBox"/>
        <button onclick="login()">login</button>
        <button onclick="register()">register</button>
    </div>
</body>
<script type="text/javascript">


    async function login(){
        const {API_URL} = await import("../constants.js");
        const username = document.getElementById("usernameBox").value
        const password = document.getElementById("passwordBox").value
        // console.log(`username:${username} password: ${password}`);
        if (!API_URL){
            alert("failed to acuire  API_URL!")
            return
        }
        res = await fetch( API_URL+"/login", {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({username: username, pass: password})
  });
}
  async function register(){
        const {API_URL} = await import("../constants.js");
        const username = document.getElementById("usernameBox").value
        const password = document.getElementById("passwordBox").value
        // console.log(`username:${username} password: ${password}`);
        if (!API_URL){
            alert("failed to acuire  API_URL!")
            return
        }
        res = await fetch( API_URL+"/register", {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({username: username, pass: password,cpass: password})
  });
}

    
</script>
</html>
